<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Testing — Ingleside RFS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; background: #f7f2e8; }
    body { display: flex; flex-direction: column; margin: 0; padding: 0; overflow: hidden; }

    /* Dev banner */
    .dev-bar {
      background: #1a1a1a;
      border-bottom: 2px solid #888;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .dev-bar span {
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
    }
    .dev-bar strong { color: #C9A84C; }
    .dev-back {
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #aaa;
      background: none;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .dev-back:hover { border-color: #aaa; color: #fff; }

    /* Full-width iframe — no mobile cap */
    .frame-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      min-width: 0;
    }
  </style>
</head>
<body>
  <div class="dev-bar">
    <span>🧪 <strong>TESTING</strong> — Crew Assignment Desktop Layout</span>
    <a class="dev-back" href="personnel.html">← Back to Personnel</a>
  </div>
  <div class="frame-wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbycaRVcBRnpTW69Nm94eMod5w6dyexGcK_Kb88soMG2nE1MyLkWIFRjHe7JcvWVw7ypoA/exec"
      title="Ingleside RFS — Crew Assignment (Testing)"
      allow="clipboard-write">
    </iframe>
  </div>
</body>
</html>
