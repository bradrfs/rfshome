<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Testing — Ingleside RFS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a1a1a;
    }
    .dev-bar {
      background: #1a1a1a;
      border-bottom: 2px solid #555;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      width: 100%;
    }
    .dev-bar span {
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
    }
    .dev-bar strong { color: #C9A84C; }
    .dev-back {
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #aaa;
      background: none;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .dev-back:hover { border-color: #aaa; color: #fff; }
    /* iframe fills 100% of remaining height and width — no gaps */
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 30px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="dev-bar">
    <span>🧪 <strong>TESTING</strong> — Crew Assignment Desktop Layout</span>
    <a class="dev-back" href="personnel.html">← Back to Personnel</a>
  </div>
  <iframe
    src="https://script.google.com/macros/s/AKfycbwOvlKhHjrtyhVSQOI8H_Dt56FTO_I6YAhe-b337_XrZhRcUVZO1MroHt-4Wn_mdK9i/exec"
    title="Ingleside RFS — Crew Assignment (Testing)"
    allow="clipboard-write">
  </iframe>
</body>
</html>
